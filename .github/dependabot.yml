version: 2

updates:
  # Update npm packages
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: monthly
    cooldown:
      default-days: 4
    groups:
      stylelint:
        patterns:
          - 'stylelint'
          - 'stylelint-config-gds'

  # Update GitHub Actions
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
